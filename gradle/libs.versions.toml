okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
newpipeExtractor = { module = "com.github.TeamNewPipe:NewPipeExtractor", version.ref = "newpipeExtractor" }
slf4jApi = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
luckpermsApi = { module = "net.luckperms:api", version.ref = "luckperms" }
worldguardApi = { module = "com.sk89q.worldguard:worldguard-bukkit", version.ref = "worldguard" }
velocityApi = { module = "com.velocitypowered:velocity-api", version.ref = "velocityApi" }
bungeecordApi = { module = "net.md-5:bungeecord-api", version.ref = "bungeecordApi" }

[plugins]
paperweight = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
platformweaver = { id = "io.github.arnodoelinger.platformweaver", version.ref = "platformweaver" }
